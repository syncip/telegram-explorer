services:
  telex:
    build: .
    container_name: telegram-explorer
    restart: unless-stopped
    env_file: .env
    ports:
      # The web UI belongs behind an HTTPS reverse proxy, hence localhost only.
      - "127.0.0.1:8080:8080"
      - "2222:2222"
    volumes:
      - telex-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  telex-data:
